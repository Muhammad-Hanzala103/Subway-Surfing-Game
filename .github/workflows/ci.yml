name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-mock ruff mypy
        
    - name: Run Ruff Linter
      run: |
        ruff check .
        
    - name: Run Mypy Type Checking
      run: |
        mypy . || true # Optional enforcement for now until types are fully added
        
    - name: Run Pytest
      run: |
        # Set headless environment variable if your tests need it, though they should be mocked
        pytest tests/
